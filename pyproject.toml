[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intent-engineering"
version = "0.1.0"
description = "Local-first intent graph and reconciliation engine for software repositories"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2,<3",
  "typer>=0.12,<1",
  "PyYAML>=6,<7",
  "jsonschema>=4,<5",
  "structlog>=24,<27",
  "anyio>=4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "mypy>=1.13,<2",
]

[project.scripts]
intent = "intent_engineering.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/intent_engineering"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["intent_engineering"]
