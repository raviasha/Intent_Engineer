name: Intent sync

"on":
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions: {}

concurrency:
  group: intent-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    environment: intent-ci
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Intent Engineering
        run: python -m pip install .
      - name: Restore verified approved intent state
        run: python -m intent_engineering.integrations.github_action restore
        env:
          INTENT_CI_SHARED_STATE_TRUST: ${{ secrets.INTENT_CI_SHARED_STATE_TRUST }}
      - name: Capture configured source versions
        run: intent sync --project . --sources markdown,git,github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Validate captured canonical state
        run: intent validate --project .
      - name: Render drift and assurance report
        run: intent drift --project . --format markdown --output intent-drift.md
      - uses: actions/upload-artifact@v4
        with:
          name: intent-drift
          path: intent-drift.md
          retention-days: 7
          if-no-files-found: error
      - name: Require resolution of pending review
        run: intent check --require-review
