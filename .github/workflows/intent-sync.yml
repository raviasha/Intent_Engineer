name: Intent sync

"on":
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions: {}

concurrency:
  group: intent-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    environment: intent-ci
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Intent Engineering
        run: python -m pip install .
      - name: Restore verified approved intent state
        run: python -m intent_engineering.integrations.github_action restore
        env:
          INTENT_CI_SHARED_STATE_TRUST: ${{ secrets.INTENT_CI_SHARED_STATE_TRUST }}
      - name: Capture configured source versions
        run: intent sync --project . --sources markdown,git,github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Validate captured canonical state
        run: intent validate --project .
      - name: Render drift and assurance report
        run: intent drift --project . --format markdown --output intent-drift.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: intent-drift
          path: intent-drift.md
          retention-days: 7
          if-no-files-found: error
      - name: Require resolution of pending review
        run: intent check --require-review
