name: Intent Engineering

"on":
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intent-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Intent Engineering / check
    runs-on: ubuntu-24.04
    environment: intent-ci
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Intent Engineering and test dependencies
        run: python -I -m pip install '.[dev]'
      - name: Restore verified approved intent state
        run: python -I -m intent_engineering.integrations.github_action restore
        env:
          INTENT_CI_SHARED_STATE_TRUST: ${{ secrets.INTENT_CI_SHARED_STATE_TRUST }}
      - name: Execute and consume reviewed tests in one immutable image
        run: python -I -m intent_engineering.integrations.immutable_ci
        env:
          INTENT_CI_SHARED_STATE_TRUST: ${{ secrets.INTENT_CI_SHARED_STATE_TRUST }}
      - uses: actions/upload-artifact@v4
        with:
          name: intent-test-results
          path: .intent-ci/test-results.json
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
