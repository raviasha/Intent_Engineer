name: Intent Engineering

"on":
  pull_request_target:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intent-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Intent Engineering / check
    runs-on: ubuntu-24.04
    environment: intent-ci
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          path: .intent-trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install protected hash-locked tooling dependencies
        run: "python -I -m pip install --require-hashes --only-binary=:all: -r .intent-trusted/src/intent_engineering/integrations/ci-runtime.lock"
      - name: Fetch proposed revision as Git objects only
        run: python -I .intent-trusted/ci/launch.py fetch
        env:
          INTENT_CI_TOOLING_SHA: ${{ github.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
      - name: Test then destroy before independent final assurance
        run: python -I .intent-trusted/ci/launch.py check
        env:
          INTENT_CI_TOOLING_SHA: ${{ github.workflow_sha }}
          INTENT_CI_SHARED_STATE_TRUST: ${{ secrets.INTENT_CI_SHARED_STATE_TRUST }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: intent-test-results
          path: .intent-trusted/.intent-ci/test-results.json
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
