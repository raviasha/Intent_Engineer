name: Publish plugin marketplace

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: plugin-marketplace-release
  cancel-in-progress: false

jobs:
  source-check:
    runs-on: ubuntu-22.04
    steps:
      - name: Require successful source CI on current main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          test "$REF" = refs/heads/main
          test "$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)" = "$REVISION"
          gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$REVISION&status=success" --jq '.workflow_runs | length' | awk '$1 > 0 {ok=1} END {exit !ok}'
  build:
    needs: source-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
          - target: linux-x86_64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'hatchling==1.27.0'
      - name: Build pinned native runtime
        env:
          TARGET: ${{ matrix.target }}
          REVISION: ${{ github.sha }}
        run: python scripts/plugin_distribution.py build --target "$TARGET" --revision "$REVISION" --output native
      - name: Relocate and test without external Python or intent
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mv native 'relocated package'
          'relocated package/plugin/runtime/'"$TARGET"'/python/bin/python3' -B -I scripts/smoke_plugin.py --plugin 'relocated package/plugin'
          python scripts/plugin_distribution.py verify --output 'relocated package'
          tar -czf "$TARGET.tar.gz" -C 'relocated package' .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.target }}.tar.gz
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
      - name: Assemble all verified platforms
        env:
          REVISION: ${{ github.sha }}
        run: |
          for target in macos-arm64 macos-x86_64 linux-x86_64; do
            mkdir -p "inputs/$target"
            tar -xzf "artifacts/$target/$target.tar.gz" -C "inputs/$target"
          done
          python scripts/plugin_distribution.py assemble --inputs inputs --output distribution --revision "$REVISION"
          python scripts/plugin_distribution.py verify --output distribution
      - name: Publish a normal commit to the distribution branch
        env:
          REVISION: ${{ github.sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$REVISION"
          if git ls-remote --exit-code origin refs/heads/marketplace; then
            git fetch origin marketplace
            git worktree add --detach publish-tree origin/marketplace
          else
            git worktree add --detach publish-tree HEAD
            git -C publish-tree switch --orphan marketplace-initial
          fi
          rsync -a --delete --exclude=.git distribution/ publish-tree/
          git -C publish-tree config user.name 'github-actions[bot]'
          git -C publish-tree config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C publish-tree add -A
          if git -C publish-tree diff --cached --quiet; then exit 0; fi
          git -C publish-tree commit -m "Publish Intent Advisor from $REVISION"
          git -C publish-tree push origin HEAD:refs/heads/marketplace
